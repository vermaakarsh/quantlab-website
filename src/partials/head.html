<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{canonical}}" />
<meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Saarth by The Quant Lab" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:url" content="{{canonical}}" />
<meta property="og:image" content="https://saarth.thequantlab.in/assets/img/og-saarth.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
<link rel="preload" href="assets/fonts/anek-latin-100-600-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="assets/fonts/instrument-sans-400-600-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="assets/css/site.css" />
<script>
(function(){var r=document.documentElement,rm=matchMedia("(prefers-reduced-motion: reduce)").matches;try{var t=localStorage.getItem("tql:theme");if(t==="light"||t==="dark")r.dataset.theme=t;if(localStorage.getItem("tql:motion")!=="off"&&!rm)r.classList.add("intro");}catch(e){if(!rm)r.classList.add("intro");}r.classList.add("js");})();
</script>
</head>
<body data-page="{{page}}">
